<body>
    <h1>ODD or EVEN</h1>
    <script>
        num=Number(prompt("Enter a number"))

        if (num%2==0)
        console.log(num,"is EVEN")
        else 
        console.log(num,"is ODD")
        
        result=num%2==0?"EVEN":"ODD"
        console.log(result)
    </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let word = prompt("Enter the word");

        if (
            word.includes("a") ||
            word.includes("e") ||
            word.includes("i") ||
            word.includes("o") ||
            word.includes("u") ||
            word.includes("A") ||
            word.includes("E") ||
            word.includes("I") ||
            word.includes("O") ||
            word.includes("U")
        ) {
            console.log("Vowel is present");
        }

        if (
            !word.includes("a") &&
            !word.includes("e") &&
            !word.includes("i") &&
            !word.includes("o") &&
            !word.includes("u") &&
            !word.includes("A") &&
            !word.includes("E") &&
            !word.includes("I") &&
            !word.includes("O") &&
            !word.includes("U")
        ) {
            console.log("Vowel is not present");
        }
        </script>
</body>

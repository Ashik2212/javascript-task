<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        num=Number(prompt("Enter your number"))

        result=num>=100?`${num} Greater than 100`:`${num} Less than 100`
        console.log(result)

        num2=Number(prompt("Enter your number"))

        result=num2>=50?`${num2} Greater than 50`:`${num2} Less than 50`
        console.log(result)
    </script>
</body>

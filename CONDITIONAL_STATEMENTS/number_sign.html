<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Number Sign</h1>
    <script>
        num=Number(prompt("Enter a number"))
        if (num>0)
        console.log("Positive")
        else if (num==0)
        console.log("Zero")
        else
        console.log("Negative")
    </script>
</body>
</html>

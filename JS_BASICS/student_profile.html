<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let studentName = "Ashik";
        let age = 22;
        let course = "Python Full Stack";

        let mark1 = 85;
        let mark2 = 90;
        let mark3 = 80;

        let numberOfSubjects = 3;

        let totalMarks = mark1 + mark2 + mark3;

        let averageMarks = totalMarks / numberOfSubjects;
        
        console.log("Student Name: " + studentName);
        console.log("Age: " + age);
        console.log("Course: " + course);
        console.log("Mark 1: " + mark1);
        console.log("Mark 2: " + mark2);
        console.log("Mark 3: " + mark3);
        console.log("Number of Subjects: " + numberOfSubjects);
        console.log("Total Marks: " + totalMarks);
        console.log("Average Marks: " + averageMarks);
    </script>
</body>

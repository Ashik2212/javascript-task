<body>
    <script>
        a=Number(prompt("Enter first number: "));
        b=parseFloat(prompt("Enter second number: "));
        c=a+b
        d=a-b
        e=a*b
        f=a**b
        g=a/b
        h=a%b

        console.log(a,"and",b)
        console.log(c)
        console.log(d)
        console.log(e)
        console.log(f)
        console.log(g)
        console.log(h)

    </script>
</body>

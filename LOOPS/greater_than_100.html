<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for (let i = 1; i <= 5; i++) {
            let num = Number(prompt("Enter number " + i + ":"));

            if (num > 100) {
                console.log(num + " is greater than 100");
            }
        }
    </script>
</body>
</html>

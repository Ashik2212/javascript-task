<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for (let i = 1; i <= 5; i++) {
            let mark = Number(prompt("Enter mark of student " + i + ":"));

            if (mark >= 40) {
                console.log("Student " + i + " passed");
            } else {
                console.log("Student " + i + " failed");
            }
        }
    </script>
</body>
</html>

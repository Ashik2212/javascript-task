<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for (let i = 1; i <= 5; i++) {
            let age = Number(prompt("Enter age of person " + i + ":"));

            if (age >= 18) {
                console.log("Person " + i + " is eligible to vote");
            }
        }
    </script>
</body>
</html>

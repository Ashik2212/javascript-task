<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for (let i = 1; i <= 3; i++) {
            let i = Number(prompt("Enter a number:"));

            console.log(i)

            if (i % 5 === 0) {
                console.log(`${i} is divisible by 5`);
            }
        }
    </script>
</body>
</html>

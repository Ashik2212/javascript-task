<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for (let i = 1; i <= 5; i++) {
            let year = Number(prompt("Enter year " + i + ":"));

            if (year % 4 === 0) {
                console.log(year + " is a leap year");
            } else {
                console.log(year + " is not a leap year");
            }
        }
    </script>
</body>
</html>
